<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="purpleGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for ambient glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.06); }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pulsing-glow {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .badge-float {
      animation: floatBadge 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      letter-spacing: 3.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .mono-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="220" cy="140" r="180" fill="url(#purpleGlow)" class="pulsing-glow" />
  <circle cx="820" cy="180" r="190" fill="url(#cyanGlow)" class="pulsing-glow" />
  <circle cx="500" cy="50" r="140" fill="url(#pinkGlow)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1000" height="320" rx="16" fill="url(#cyberGrid)" />

  <!-- Sleek Outer Border Frame -->
  <rect x="1.5" y="1.5" width="997" height="317" rx="15" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Decorative Circuit Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="50" cy="20" r="3" fill="#38bdf8" />
  <path d="M 980 270 L 980 300 L 950 300" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="950" cy="300" r="3" fill="#a855f7" />

  <!-- Status Pill Header -->
  <g class="badge-float" transform="translate(370, 32)">
    <rect width="260" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="15" r="5" fill="#10b981" />
    <circle cx="18" cy="15" r="8" fill="#10b981" opacity="0.35" />
    <text x="34" y="19.5" fill="#94a3b8" font-size="11.5" class="mono-text" font-weight="600" letter-spacing="1">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- Floating Left Code Snippet (Glassmorphism card) -->
  <g transform="translate(45, 95)" opacity="0.75">
    <rect width="150" height="75" rx="10" fill="#090d16" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="16" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="27" cy="16" r="3.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="38" cy="16" r="3.5" fill="#10b981" opacity="0.8" />
    <text x="14" y="42" fill="#38bdf8" font-size="10.5" class="mono-text">const dev = {</text>
    <text x="22" y="58" fill="#a78bfa" font-size="10" class="mono-text">ai: true,</text>
    <text x="22" y="70" fill="#34d399" font-size="10" class="mono-text">stack: "full"</text>
    <text x="14" y="82" fill="#38bdf8" font-size="10.5" class="mono-text">};</text>
  </g>

  <!-- Floating Right Neural Graph Accents -->
  <g transform="translate(805, 95)" opacity="0.8">
    <rect width="150" height="75" rx="10" fill="#090d16" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
    <!-- Neural Node Links -->
    <line x1="30" y1="28" x2="75" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="30" y1="52" x2="75" y2="20" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="30" y1="28" x2="75" y2="58" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="30" y1="52" x2="75" y2="58" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="75" y1="20" x2="120" y2="38" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="75" y1="58" x2="120" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    
    <circle cx="30" cy="28" r="5" fill="#38bdf8" />
    <circle cx="30" cy="52" r="5" fill="#8b5cf6" />
    <circle cx="75" cy="20" r="5.5" fill="#c084fc" />
    <circle cx="75" cy="58" r="5.5" fill="#06b6d4" />
    <circle cx="120" cy="38" r="6" fill="#f43f5e" />
  </g>

  <!-- Central Hero Content -->
  <g transform="translate(500, 140)" text-anchor="middle">
    <!-- Main Name -->
    <text y="0" fill="url(#nameGrad)" font-size="46" class="title-text" filter="url(#softGlow)">AMEY BAUCHKAR</text>
    
    <!-- Subtitle -->
    <text y="38" fill="#e2e8f0" font-size="16.5" class="subtitle-text" font-weight="600">
      FULL STACK DEVELOPER <tspan fill="#38bdf8">✦</tspan> AI &amp; ML ENTHUSIAST
    </text>

    <!-- Tagline -->
    <text y="64" fill="#64748b" font-size="13" class="mono-text">
      crafting scalable web applications &amp; intelligent systems
    </text>
  </g>

  <!-- Bottom Interactive Tech Pillars (Pills) -->
  <g transform="translate(500, 260)" text-anchor="middle">
    <g transform="translate(-360, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#38bdf8" font-size="11.5" class="mono-text" font-weight="600">⚛ React</text>
    </g>
    <g transform="translate(-215, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#facc15" font-size="11.5" class="mono-text" font-weight="600">🐍 Python</text>
    </g>
    <g transform="translate(-70, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#60a5fa" font-size="11.5" class="mono-text" font-weight="600">⚡ TypeScript</text>
    </g>
    <g transform="translate(85, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#f43f5e" font-size="11.5" class="mono-text" font-weight="600">🔥 PyTorch</text>
    </g>
    <g transform="translate(235, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#e2e8f0" font-size="11.5" class="mono-text" font-weight="600">▲ Next.js</text>
    </g>
    <g transform="translate(375, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text y="4.5" fill="#38bdf8" font-size="11.5" class="mono-text" font-weight="600">☁ Azure</text>
    </g>
  </g>
</svg>
